<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador | Laboratorio MQTT</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="env/credential.js"></script>
    <style>
        body { margin: 2rem auto; padding: 0 1rem; max-width: 48rem; font: 1rem/1.6 system-ui, sans-serif; }
        li { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <nav><a href="index.html">Volver al laboratorio</a></nav>
    <main>
        <h1>Simulador MQTT</h1>
        <p id="description">Elige un proyecto para simular un dispositivo.</p>
        <ul id="projects">
            <li><a href="?proyecto=hogar">Domótica y seguridad del hogar</a></li>
            <li><a href="?proyecto=tren">Operación de metro</a></li>
        </ul>
        <p id="status" role="status" hidden></p>
        <section id="activity" hidden>
            <h2>Mensajes recientes</h2>
            <ul id="log"></ul>
        </section>
    </main>
    <script>
        const homeEvents = new Map([
            ['incendio', ['hogar/sensor/humo', 'alto']],
            ['gas', ['hogar/sensor/gas', 'alto']],
            ['movimiento', ['hogar/sensor/movimiento', 'si']],
            ['persona_llegando', ['hogar/sensor/movimiento', 'si']]
        ]);
        const homeStates = new Map([
            ['hogar/living/luz/set', ['hogar/living/luz/state', ['on', 'off']]],
            ['hogar/cocina/luz/set', ['hogar/cocina/luz/state', ['on', 'off']]],
            ['hogar/dormitorio/luz/set', ['hogar/dormitorio/luz/state', ['on', 'off']]],
            ['hogar/puerta/principal/set', ['hogar/puerta/principal/state', ['open', 'close']]],
            ['hogar/alarma/set', ['hogar/alarma/state', ['enabled', 'disabled']]],
            ['hogar/living/tv/set', ['hogar/living/tv/state', ['on', 'off']]]
        ]);
        const metroStates = new Map([
            ['metro/tren1/puertas/set', ['open', 'close']],
            ['metro/tren1/freno_emergencia/set', ['on', 'off']],
            ['metro/estacion1/luces/set', ['on', 'off']],
            ['metro/estacion1/alarma/set', ['normal', 'incendio']],
            ['metro/sistema/modo/set', ['normal', 'hora_punta', 'baja_demanda']]
        ]);

        function isIntegerBetween(value, min, max) {
            return /^\d+$/.test(value) && Number(value) >= min && Number(value) <= max;
        }

        function simulateHome(topic, value) {
            if (topic === 'hogar/evento/simulacion/set') {
                const event = homeEvents.get(value);
                return event ? [event] : [];
            }
            if (topic === 'hogar/clima/temperatura/set' && isIntegerBetween(value, 16, 30)) {
                return [['hogar/clima/temperatura', value]];
            }
            const state = homeStates.get(topic);
            return state?.[1].includes(value) ? [[state[0], value]] : [];
        }

        function simulateMetro(topic, value) {
            if (topic === 'metro/tren1/velocidad/set' && isIntegerBetween(value, 0, 80)) {
                return [['metro/tren1/velocidad', value]];
            }
            if (topic === 'metro/tren1/freno_emergencia/set' && value === 'on') {
                return [['metro/tren1/freno_emergencia', 'on'], ['metro/tren1/velocidad', '0']];
            }
            if (topic === 'metro/estacion1/evacuacion/set' && value === 'start') {
                return [['metro/estacion1/alarma', 'evacuacion']];
            }
            if (metroStates.get(topic)?.includes(value)) {
                return [[topic.slice(0, -4), value]];
            }
            return [];
        }

        function startSimulator(project, name, commands, simulate) {
            document.querySelector('h1').textContent = `Simulador de ${name}`;
            document.getElementById('description').textContent =
                'Deja esta pestaña abierta mientras envías comandos desde el panel de control.';
            document.getElementById('projects').hidden = true;
            document.getElementById('activity').hidden = false;
            const status = document.getElementById('status');
            status.hidden = false;
            status.textContent = 'Conectando al broker…';
            const log = document.getElementById('log');
            const client = createMqttClient(`client_${project}`);

            function appendLog(message) {
                const item = document.createElement('li');
                item.textContent = message;
                log.prepend(item);
                if (log.childElementCount > 25) log.lastElementChild.remove();
            }

            client.on('connect', () => {
                client.subscribe(commands, { qos: 1 }, (error, granted) => {
                    status.textContent = error || granted?.length !== commands.length || granted.some(({ qos }) => qos > 2)
                        ? 'El broker rechazó la suscripción a comandos.'
                        : 'Listo para recibir comandos.';
                });
            });
            client.on('offline', () => { status.textContent = 'Sin conexión al broker.'; });
            client.on('reconnect', () => { status.textContent = 'Volviendo a conectar…'; });
            client.on('error', () => { status.textContent = 'Error de conexión MQTT.'; });
            client.on('message', (topic, message, packet) => {
                if (packet.retain) return;
                const value = message.toString();
                for (const [stateTopic, state] of simulate(topic, value)) {
                    client.publish(stateTopic, state, { qos: 1 }, error => {
                        appendLog(error
                            ? `Error al publicar ${stateTopic}`
                            : `${topic} = ${value} → ${stateTopic} = ${state}`);
                    });
                }
            });
        }

        const project = new URLSearchParams(window.location.search).get('proyecto');
        if (project === 'hogar') {
            startSimulator(project, 'domótica', [
                ...homeStates.keys(),
                'hogar/evento/simulacion/set',
                'hogar/clima/temperatura/set'
            ], simulateHome);
        }
        if (project === 'tren') {
            startSimulator(project, 'metro', [
                ...metroStates.keys(),
                'metro/tren1/velocidad/set',
                'metro/estacion1/evacuacion/set'
            ], simulateMetro);
        }
    </script>
</body>
</html>
